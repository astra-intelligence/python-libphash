name: Site

# The documentation site (zensical.toml, docs/), built strictly and its links checked on
# every push and pull request that changes it, and published to GitHub Pages
# (https://gudoshnikovn.github.io/python-libphash/) by a release tag, so that the
# published site describes the latest release; a release candidate (rcK) publishes
# nothing. "Run workflow" builds the site of the chosen branch, and on main publishes it
# again. The code on the pages runs in the test suite (tests/test_docs.py,
# tests/test_examples.py), not here.
on:
  push:
    branches: [ main, 'release/**' ]
    tags: [ 'v*', '!v*rc*' ]
    paths: &site-paths
      - docs/**
      - zensical.toml
      - examples/**
      - src/libphash/**
      - README.md
      - CHANGELOG.md
      - MIGRATION.md
      - SECURITY.md
      - CONTRIBUTING.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/site.yml
  pull_request:
    branches: [ main, 'release/**' ]
    paths: *site-paths
  workflow_dispatch:

# Read-only by default: only the deploy job writes, and only to Pages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The API reference reads the package's source, not a build: no submodules.
    - uses: ./.github/actions/setup
      with:
        submodules: 'false'

    - name: Build (warnings fail)
      run: uv run --locked --only-group docs zensical build --strict

    # Every link and anchor. The site's own address, in each page's canonical link and in
    # the pages made from the README and the changelog, and the root-relative links of
    # 404.html are mapped onto the build, which is what that address serves;
    # links into main on GitHub are skipped, since a branch may add the file they name.
    # The changelog's compare links name the tag of the release being prepared, which a
    # release branch does not have yet: they are checked on main and on a tag.
    - name: Check the links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: >-
          --root-dir ${{ github.workspace }}/build/site --include-fragments --no-progress
          --remap '^https://gudoshnikovn\.github\.io/python-libphash/(.*)$ file://${{ github.workspace }}/build/site/$1'
          --remap '^file://(.*)/build/site/python-libphash(/.*)?$ file://$1/build/site$2'
          --exclude '^https://github\.com/gudoshnikovn/python-libphash/(blob|tree)/main/'
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && ' ' || '--exclude ^https://github\.com/gudoshnikovn/python-libphash/compare/' }}
          'build/site/**/*.html'
        fail: true

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-html
        path: build/site/
        retention-days: 14

    - name: Upload the site for Pages
      if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: build/site/

  # Settings -> Pages -> Source is "GitHub Actions"; github-pages is the environment
  # GitHub creates for it. Two deploys queue one after the other.
  deploy:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
