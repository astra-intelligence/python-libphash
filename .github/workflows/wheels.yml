name: Wheels

# Every wheel a release has, built and tested by cibuildwheel (configuration in
# pyproject.toml, which also says which platforms get wheels): per platform one abi3
# wheel, built on the oldest CPython and tested on each later one, and a wheel per
# free-threaded CPython. The code itself is tested on every platform by ci.yml; what
# only a wheel build exercises is the build: the manylinux images, the free-threaded
# builds, the repair of each wheel and the cibuildwheel configuration. Beyond each
# wheel's test suite, every wheel writes the hashes of every fixture under each Python
# it is for, and the tables of all platforms must be the same byte for byte; and
# libphash configured without libjpeg-turbo, decoding JPEG with stb_image, passes the
# suite with its own golden hashes. Every wheel and the sdist pass tools/audit.py
# (exports, dependencies, licenses, SBOM, contents) and twine's checks, and abi3audit
# holds the abi3 wheel to the limited API of 3.10; the sdist is built twice and must be
# the same bytes, and a wheel is built from it without an index. So the workflow runs
# when a file the build reads changes, by hand, and from release.yml, which publishes
# the artifacts it uploads.
on:
  push:
    branches: [ main, 'release/**' ]
    paths: &build-paths
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - tools/cdef.py
      - tools/ffi.py
      - tools/native.py
      - tools/sbom.py
      - tools/sdist.py
      - tools/audit.py
      - tools/hash_table.py
      - native/libphash
      - .github/actions/setup/**
      - .github/workflows/wheels.yml
  pull_request:
    branches: [ main, 'release/**' ]
    paths: *build-paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Named, not ${{ github.workflow }}: called from release.yml, that would be the
# caller's name, and the group the caller itself holds.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per platform tag, so that the wheels of a runner build side by side.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: manylinux_x86_64 }
          - { os: ubuntu-24.04-arm, platform: manylinux_aarch64 }
          - { os: macos-15, platform: macosx_arm64 }
          - { os: windows-2025, platform: win_amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: wheels (${{ matrix.platform }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup

    # Every file in the wheel is dated to the commit, so that the same commit gives the
    # same wheel (pyproject.toml passes the variable into the manylinux container).
    - name: Date the build to the commit
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      env:
        CIBW_BUILD: '*-${{ matrix.platform }}'

    - name: Audit the wheels
      shell: bash
      run: |
        uv run --no-project --with lief --with 'setuptools>=77' python tools/audit.py wheelhouse/*.whl
        uvx abi3audit --strict --verbose wheelhouse/*-abi3-*.whl
        uvx twine check --strict wheelhouse/*.whl
        uvx check-wheel-contents wheelhouse/*.whl

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.platform }}
        path: wheelhouse/*.whl
        if-no-files-found: error

    # Each wheel with each Python it is for, installed by uv on the runner itself: every
    # wheel is for the runner's own architecture, and a manylinux wheel runs on Ubuntu.
    # The abi3 wheel serves every CPython with the GIL from 3.10 on; a free-threaded
    # wheel's ABI tag names its Python (cp314t -> 3.14t).
    - name: Hash tables of the wheels
      shell: bash
      run: |
        mkdir tables
        for wheel in wheelhouse/*.whl; do
          name=$(basename "$wheel" .whl)
          abi=$(echo "$name" | cut -d- -f4)
          if [ "$abi" = abi3 ]; then
            pythons="3.10 3.11 3.12 3.13 3.14 3.15"
          else
            pythons="${abi:2:1}.${abi:3}"
          fi
          for python in $pythons; do
            uv run --no-project --python "$python" --with "$wheel" \
              python tools/hash_table.py native/libphash/tests/data > "tables/$name-$python.txt"
          done
        done

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hash-tables-${{ matrix.platform }}
        path: tables/*.txt
        if-no-files-found: error

  # The tables of every wheel of every platform, compared with one another.
  parity:
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: hash-tables-*
        merge-multiple: true
        path: tables

    - name: Every wheel gives the same hashes
      shell: bash
      run: |
        tables=(tables/*.txt)
        status=0
        for t in "${tables[@]}"; do
          if ! cmp -s "${tables[0]}" "$t"; then
            echo "::error::$(basename "$t") differs from $(basename "${tables[0]}")"
            diff "${tables[0]}" "$t" | head -40
            status=1
          fi
        done
        echo "${#tables[@]} tables of $(wc -l < "${tables[0]}") lines"
        exit $status

  # The sdist, built twice from the commit and compared byte for byte, audited, and
  # built into a wheel by pip without an index or network access to build tools: what
  # an offline build from the sdist does.
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup

    - name: Build the sdist twice
      run: |
        SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
        export SOURCE_DATE_EPOCH
        uv build --sdist -o dist
        uv build --sdist -o "$RUNNER_TEMP/again"
        cmp dist/*.tar.gz "$RUNNER_TEMP"/again/*.tar.gz
        sha256sum dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"

    - name: Audit the sdist
      run: |
        uv run --no-project --with lief --with 'setuptools>=77' python tools/audit.py dist/*.tar.gz
        uvx twine check --strict dist/*.tar.gz

    - name: Build a wheel from the sdist without an index
      run: |
        uv venv "$RUNNER_TEMP/offline"
        VIRTUAL_ENV="$RUNNER_TEMP/offline" uv pip install pip setuptools cffi cmake ninja
        "$RUNNER_TEMP/offline/bin/python" -m pip wheel --no-index --no-build-isolation \
          --no-deps -w "$RUNNER_TEMP/wheel" dist/*.tar.gz
        "$RUNNER_TEMP/offline/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
        "$RUNNER_TEMP/offline/bin/python" -c "import libphash; print(libphash.build_info())"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  # libphash configured without libjpeg-turbo decodes JPEG with stb_image, as its own CI
  # tests: the suite picks the stb golden file and the parity tests build their C
  # reference against the same install.
  stb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: test (JPEG by stb_image)
    env:
      LIBPHASH_CMAKE_ARGS: -DPHASH_USE_LIBJPEG_TURBO=OFF
      LIBPHASH_REQUIRE_C_REFERENCE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup

    - name: Build and install (editable)
      run: uv sync --locked --all-extras

    - name: build_info
      run: uv run --no-sync python -c "import libphash; print(libphash.build_info())"

    - name: pytest
      run: uv run --no-sync pytest -rs
