[build-system]
requires = [
  "setuptools>=61.0",
  "cffi>=1.15.0",
  "cmake>=3.21",
  # Ninja under MSVC needs a developer command prompt; CMake's default
  # Visual Studio generator does not.
  "ninja; sys_platform != 'win32'",
]
build-backend = "setuptools.build_meta"

[project]
name = "python-libphash"
dynamic = ["version"]
description = "High-performance perceptual hashing library (CFFI bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "gudoshnikovn", email = "gudoshnikovna@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["cffi>=1.15.0"]
[project.urls]
"Homepage" = "https://github.com/gudoshnikovn/python-libphash"

[project.optional-dependencies]
dev = ["pytest", "mypy", "basedpyright", "ruff", "typos", "setuptools", "types-setuptools", "types-cffi", "typing_extensions", "numpy", "Pillow"]
benchmark = ["imagehash", "Pillow", "pandas", "tabulate", "scikit-learn", "tqdm", "numpy"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.package-data]
libphash = ["py.typed", "*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "libphash._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp36* cp37* cp38* pp*"

# CMake and Ninja come from build-system.requires. nasm gives libjpeg-turbo its x86
# SIMD; without it the decoder builds without SIMD, slower but with the same hashes.
[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "if command -v dnf >/dev/null; then dnf install -y nasm; elif command -v yum >/dev/null; then yum install -y nasm; elif command -v apk >/dev/null; then apk add nasm; fi"

[tool.cibuildwheel.macos]
before-all = "brew install nasm || true"

[tool.mypy]
strict = true
files = ["src", "tests", "tools", "setup.py"]
mypy_path = ["src", "tools"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests", "tools", "setup.py"]
# tools/ is imported by setup.py and the tests through sys.path.
extraPaths = ["tools"]
pythonVersion = "3.9"

[tool.ruff]
extend-exclude = ["native", "benchmarks"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "A", "S", "SIM", "RUF", "PL", "PT", "ANN",
    "ARG", "BLE", "C4", "FA", "FLY", "FURB", "G", "ICN", "ISC", "LOG", "NPY", "PERF",
    "PGH", "PIE", "PYI", "RET", "RSE", "SLOT", "T20", "TC", "TID",
]
ignore = [
    # A class docstring documents its constructor and dunder methods.
    "D105", "D107",
    # A ph_context_t *, ph_digest_t * or other cffi pointer is typed Any by cffi.
    "ANN401",
    # Array ranks, channel counts and expected test values read better as literals.
    "PLR2004",
]

[tool.ruff.lint.isort]
# tools/ is imported through sys.path.
known-first-party = ["libphash", "cdef", "native"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# hash() is the main entry point, called as libphash.hash, never imported bare.
"src/libphash/__init__.py" = ["A001"]
# Tests are documented by their names and assert is how pytest checks. They pickle and
# eval the library's own objects, and random draws test images, not secrets.
"tests/**" = ["D100", "D103", "S101", "S301", "S307", "S311"]
# The build runs CMake from PATH or the build environment, with arguments it builds.
"tools/native.py" = ["S603"]

[tool.typos.files]
extend-exclude = ["native", "tmp", "build", "dist"]

[tool.typos.default.extend-identifiers]
# Pillow's mode name for RGB with premultiplied alpha.
RGBa = "RGBa"
