[build-system]
requires = [
  "setuptools>=61.0",
  "cffi>=1.15.0",
  "cmake>=3.21",
  # Ninja under MSVC needs a developer command prompt; CMake's default
  # Visual Studio generator does not.
  "ninja; sys_platform != 'win32'",
]
build-backend = "setuptools.build_meta"

[project]
name = "python-libphash"
dynamic = ["version"]
description = "High-performance perceptual hashing library (CFFI bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "gudoshnikovn", email = "gudoshnikovna@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["cffi>=1.15.0"]
[project.urls]
"Homepage" = "https://github.com/gudoshnikovn/python-libphash"

[project.optional-dependencies]
dev = ["pytest", "pytest-randomly", "pytest-timeout", "hypothesis", "psutil", "coverage", "mypy", "basedpyright", "ruff", "typos", "setuptools", "types-setuptools", "types-cffi", "types-psutil", "typing_extensions", "numpy", "Pillow", "mutmut; sys_platform != 'win32'"]

# Not part of "dev": atheris has wheels for Linux x86-64 and CPython 3.12+ only, and the
# sanitizer job of CI, which runs the fuzzers, installs it with --group fuzz.
[dependency-groups]
fuzz = [
  "atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.package-data]
libphash = ["py.typed", "*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "libphash._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build-verbosity = 1
# Wheels exist for the platforms libphash's own CI supports, so that a wheel carries a
# library built the way libphash tests it: Linux x86-64 and arm64 (glibc), macOS arm64
# and Windows x86-64. Elsewhere pip builds the sdist.
skip = ["*-musllinux_*"]
# numpy and Pillow are optional at runtime; with them the array and Pillow tests run
# against the wheel too. The sdist job of CI runs the suite without them.
test-requires = ["pytest", "pytest-timeout", "hypothesis", "psutil", "numpy", "Pillow"]
test-command = "pytest {project}/tests -rs"

# CMake and Ninja come from build-system.requires. nasm gives libjpeg-turbo its x86
# SIMD; without it the decoder builds without SIMD, slower but with the same hashes.
[tool.cibuildwheel.linux]
# The runner's own architecture: x86-64 and arm64 each build on a native runner, and
# the default would add i686 on x86-64.
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "if command -v dnf >/dev/null; then dnf install -y nasm; elif command -v yum >/dev/null; then yum install -y nasm; fi"

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "choco install nasm --no-progress -y"
# cibuildwheel reads the value with shell quoting, which takes a backslash as an
# escape; each one is doubled.
environment = { PATH = 'C:\\Program Files\\NASM;$PATH' }

[tool.pytest.ini_options]
# mutmut keeps a copy of the tests in mutants/.
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
# A warning is a failure: deprecations surface in the run that causes them.
filterwarnings = ["error"]
# A hung test fails on its own instead of holding the job until its timeout.
# pytest-randomly, where installed, runs the tests in a random order and prints the
# seed, so that a test depending on another one's leftovers shows up.
timeout = 300

# Branch coverage of the package, measured against the editable build. File names are
# stored relative to the checkout, so the data files of every platform's job combine
# into one report; branches that run only on Windows or only on POSIX count once
# combined, and the threshold applies to the combined report. The batch callbacks run
# on libphash's worker threads, which Python 3.14's sys.monitoring sees and the
# settrace of older versions does not: those lines count from the 3.14+ jobs.
[tool.coverage.run]
branch = true
source = ["src/libphash"]
relative_files = true
parallel = true

[tool.coverage.paths]
source = ["src/libphash/", "src\\libphash\\"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mutmut]
source_paths = ["src/libphash/"]
# The memory tests repeat every operation hundreds of times and catch no mutant the other
# tests miss; run for each mutant, they would multiply the run's time.
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/test_memory.py"]
also_copy = [
  "native/libphash/include",
  "native/libphash/tests/data",
  "tools",
  ".github/workflows",
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "tools", "setup.py"]
mypy_path = ["src", "tools", "typings"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests", "tools", "setup.py"]
# tools/ is imported by setup.py and the tests through sys.path.
extraPaths = ["tools"]
pythonVersion = "3.10"

[tool.ruff]
extend-exclude = ["native"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "A", "S", "SIM", "RUF", "PL", "PT", "ANN",
    "ARG", "BLE", "C4", "FA", "FLY", "FURB", "G", "ICN", "ISC", "LOG", "NPY", "PERF",
    "PGH", "PIE", "PYI", "RET", "RSE", "SLOT", "T20", "TC", "TID",
]
ignore = [
    # A class docstring documents its constructor and dunder methods.
    "D105", "D107",
    # Array ranks, channel counts and expected test values read better as literals.
    "PLR2004",
]

[tool.ruff.lint.isort]
# tools/ is imported through sys.path.
known-first-party = ["libphash", "cdef", "native"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# hash() is the main entry point, called as libphash.hash, never imported bare.
"src/libphash/__init__.py" = ["A001"]
# Tests are documented by their names and assert is how pytest checks. They pickle and
# eval the library's own objects, and random draws test images, not secrets.
"tests/**" = ["D100", "D103", "S101", "S301", "S307", "S311"]
# The C reference of the parity tests is built with CMake from PATH and run with the
# jobs the test builds; an image's error code is a result, caught per algorithm.
"tests/c_reference.py" = ["S603", "PERF203"]
# The build runs CMake from PATH or the build environment, with arguments it builds.
"tools/native.py" = ["S603"]
# The sanitizer builds run uv and clang from PATH, and a run starts the command it is
# given.
"tools/sanitizers.py" = ["S603", "S607"]
# A fuzz target fails by raising, so its checks are asserts; an error is an outcome to
# record for each algorithm, not a reason to stop.
"tools/fuzz_targets.py" = ["S101", "PERF203"]
# The stub's classes and parameters carry the names of the C types and of the header.
"src/libphash/_native.pyi" = ["N801", "A002"]

[tool.typos.files]
extend-exclude = ["native", "tmp", "build", "dist"]

[tool.typos.default.extend-identifiers]
# Pillow's mode name for RGB with premultiplied alpha.
RGBa = "RGBa"
